<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KONIC AI - User Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkNavy: '#0B0F19',
                        cardNavy: '#111827',
                        techBlue: '#2563EB',
                        electricCyan: '#06B6D4'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkNavy text-gray-100 h-screen flex font-sans overflow-hidden">

    <!-- Workspace Sidebar -->
    <aside class="w-72 bg-cardNavy border-r border-gray-800 flex flex-col justify-between hidden md:flex">
        <div class="p-4 flex flex-col h-full">
            <div class="flex items-center justify-between mb-6 px-2">
                <h1 class="text-lg font-bold tracking-wider text-electricCyan">KONIC AI</h1>
                <span class="text-xs bg-techBlue/20 text-electricCyan px-2 py-0.5 rounded border border-techBlue/30">User</span>
            </div>

            <button id="new-chat-btn" class="w-full bg-techBlue hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-xl transition flex items-center justify-center space-x-2 mb-4">
                <span>+ New Chat</span>
            </button>

            <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-2">Chat History</div>
            <div id="chat-history-list" class="flex-1 overflow-y-auto space-y-1 px-1">
                <!-- Dynamic history items loaded via script -->
                <div class="text-sm text-gray-500 px-2 py-1">Loading conversations...</div>
            </div>

            <div class="pt-4 border-t border-gray-800 space-y-1">
                <a href="settings.html" class="block px-3 py-2 rounded-lg text-sm text-gray-300 hover:bg-gray-800 hover:text-white transition">Account Settings</a>
                <button id="logout-btn" class="w-full text-left px-3 py-2 rounded-lg text-sm text-red-400 hover:bg-red-950/30 transition">Logout</button>
            </div>
        </div>
    </aside>

    <!-- Chat & Main Workspace Area -->
    <main class="flex-1 flex flex-col h-full bg-darkNavy">
        <!-- Top Nav Bar -->
        <header class="bg-cardNavy border-b border-gray-800 px-6 py-3.5 flex justify-between items-center">
            <h2 id="active-chat-title" class="text-md font-medium text-gray-200">New Conversation</h2>
            <div class="flex items-center space-x-3">
                <span class="text-xs text-gray-400" id="user-email-badge">Loading...</span>
            </div>
        </header>

        <!-- Message Display Area -->
        <div id="chat-messages-container" class="flex-1 overflow-y-auto p-6 space-y-6">
            <div class="flex items-start space-x-4 max-w-2xl mx-auto w-full">
                <div class="bg-cardNavy border border-gray-800 p-4 rounded-2xl text-gray-300 shadow">
                    <p>Hello! I am your KONIC AI assistant. How can I help power your workflow today?</p>
                </div>
            </div>
        </div>

        <!-- Chat Input Form -->
        <div class="p-4 bg-cardNavy border-t border-gray-800">
            <form id="chat-form" class="max-w-3xl mx-auto flex items-center space-x-2">
                <input type="text" id="user-input" required class="flex-1 bg-darkNavy border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-techBlue text-sm" placeholder="Ask KONIC AI anything...">
                <button type="submit" class="bg-techBlue hover:bg-blue-700 text-white px-5 py-3 rounded-xl font-medium text-sm transition">Send</button>
            </form>
        </div>
    </main>

    <!-- Dashboard Core Script -->
    <script type="module">
        import { auth, db } from "../config/firebase-init.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const emailBadge = document.getElementById("user-email-badge");
        const chatForm = document.getElementById("chat-form");
        const userInput = document.getElementById("user-input");
        const messagesContainer = document.getElementById("chat-messages-container");

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            emailBadge.textContent = user.email;
        });

        document.getElementById("logout-btn").addEventListener("click", async () => {
            await signOut(auth);
            window.location.href = "login.html";
        });

        chatForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // Append user message bubble
            const userMsgDiv = document.createElement("div");
            userMsgDiv.className = "flex justify-end max-w-2xl mx-auto w-full";
            userMsgDiv.innerHTML = `<div class="bg-techBlue text-white p-4 rounded-2xl shadow max-w-lg"><p>${text}</p></div>`;
            messagesContainer.appendChild(userMsgDiv);
            userInput.value = "";
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Simulate immediate conversational responsiveness until router integration
            setTimeout(() => {
                const aiMsgDiv = document.createElement("div");
                aiMsgDiv.className = "flex items-start space-x-4 max-w-2xl mx-auto w-full";
                aiMsgDiv.innerHTML = `<div class="bg-cardNavy border border-gray-800 p-4 rounded-2xl text-gray-300 shadow max-w-lg"><p>I've received your query. Fully connected AI routing is active via your backend configuration.</p></div>`;
                messagesContainer.appendChild(aiMsgDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 600);
        });
    </script>
</body>
</html>
